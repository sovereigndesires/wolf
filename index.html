<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump & Power | Iron Syndicate</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <style>
        /* ==========================================
           CORE STYLING & THEME
           ========================================== */
        :root {
            --bg-color: #0d0d12;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --accent: #ff0044;
            --text-main: #f0f0f0;
            --text-muted: #888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at top right, #3a0011, #0d0d12 40%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 0, 68, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(255, 0, 68, 0.4);
            border: 1px solid var(--accent);
        }

        h1, h2, h3, h4 { color: var(--text-main); text-transform: uppercase; letter-spacing: 2px; }
        h1 span, h2 span { color: var(--accent); }

        #auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        input, button, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1a1a24;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        
        input:focus, select:focus { outline: none; border-color: var(--accent); }

        button {
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button:hover { background: #d40038; }

        #app-container { display: none; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; }

        .chat-box {
            resize: vertical;
            overflow: hidden;
            min-height: 300px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            border-bottom: 1px solid #333;
            margin-bottom: 10px;
            padding-right: 10px;
        }
        .message { margin-bottom: 10px; font-size: 0.9em; word-wrap: break-word; }
        .message span { color: var(--accent); font-weight: bold; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; border: 1px solid #333; }
        .chat-inputs { display: flex; gap: 10px; }
        
        .poker-table { text-align: center; }
        .pot-display { font-size: 3em; color: var(--accent); margin: 20px 0; text-shadow: 0 0 10px var(--accent); }
        .bet-controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;}
        .bet-btn { width: auto; padding: 10px 20px; flex: 1; min-width: 100px; }
        
        .stake-warning { color: var(--accent); font-size: 0.8em; font-style: italic; margin-bottom: 15px; display: block;}

        .workout-form { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .workout-form input { padding: 8px; font-size: 0.9em; }
        .workout-card { background: rgba(0,0,0,0.5); padding: 12px; margin-bottom: 10px; border-left: 2px solid var(--accent); border-radius: 4px; font-size: 0.95em;}

        @media (max-width: 850px) {
            .grid { grid-template-columns: 1fr; gap: 15px; }
            header { flex-direction: column; text-align: center; gap: 15px; }
            header div { text-align: center !important; }
            #auth-container .glass-panel { width: 90% !important; max-width: 350px; }
            .chat-box { max-height: 60vh; }
            .bet-controls { flex-direction: column; }
            .bet-btn { width: 100%; }
            #admin-panel { margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="glass-panel" style="width: 350px; text-align: center;">
            <h1>Pump <span>&</span> Power</h1>
            <span class="stake-warning">Discreet. Seductive. Brutal.</span>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Enter the Club</button>
            <button onclick="register()" style="background: transparent; border: 1px solid var(--accent);">Request Access</button>
        </div>
    </div>

    <div id="app-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Iron <span>Syndicate</span></h2>
            <div style="text-align: right;">
                <span id="user-display">User</span> | Bankroll: <strong style="color:var(--accent);">$<span id="balance-display">100</span></strong>
                <button onclick="logout()" style="width: auto; padding: 5px 15px; margin-left: 15px;">Exit</button>
            </div>
        </header>

        <div class="grid">
            <div class="glass-panel">
                <h3>The Gym Ad</h3>
                <p class="text-muted" style="margin-top: 0;">Broadcast your grind.</p>
                <div class="workout-form">
                    <input type="text" id="wo-exercise" placeholder="Exercise" style="margin:0; flex: 2; min-width: 120px;">
                    <input type="number" id="wo-sets" placeholder="Sets" style="margin:0; flex: 1; min-width: 60px;">
                    <input type="number" id="wo-reps" placeholder="Reps" style="margin:0; flex: 1; min-width: 60px;">
                    <button onclick="postWorkout()" style="margin:0; flex: 1; padding: 8px; min-width: 80px;">Post</button>
                </div>
                <div id="workout-feed" style="overflow-y: auto; height: 400px; border-top: 1px solid #333; padding-top: 15px;"></div>
            </div>

            <div>
                <div class="glass-panel poker-table">
                    <h3>The Altar</h3>
                    <span class="stake-warning">Fail to reveal, lose the bet.</span>
                    <div id="active-challenge-view" style="display: none;">
                        <h4 id="challenge-desc"></h4>
                        <div class="pot-display">$<span id="pot-amount">0</span></div>
                        <div class="bet-controls">
                            <button class="bet-btn" onclick="placeBet(1)">Call $1</button>
                            <button class="bet-btn" onclick="placeBet(5)">Raise $5</button>
                            <button class="bet-btn" onclick="placeBet(10)">Raise $10</button>
                            <button class="bet-btn" style="background: #333;" onclick="fold()">Fold</button>
                        </div>
                        <button style="margin-top: 20px; background: #fff; color: #000;" onclick="revealPhoto()">REVEAL PUMP</button>
                    </div>
                    <div id="create-challenge-view">
                        <h4>Initiate a Blood-Bet</h4>
                        <select id="body-part">
                            <option value="Chest">Chest</option><option value="Glutes">Glutes</option>
                            <option value="Full Body">Full Body</option><option value="Arms">Arms</option>
                        </select>
                        <select id="seductive-stake">
                            <option value="Tight Tank">Tight Tank</option><option value="Thong">Thong</option>
                            <option value="Shirtless">Shirtless</option>
                        </select>
                        <button onclick="initiateChallenge()">Throw the Gauntlet</button>
                    </div>
                </div>

                <div id="admin-panel" class="glass-panel" style="display: none; border-color: #ffd700; box-shadow: 0 4px 30px rgba(255, 215, 0, 0.2);">
                    <h3 style="color: #ffd700;">The Architect</h3>
                    <button onclick="purgeChat()" style="background: #333; color: #ffd700;">Purge Chat</button>
                    <button onclick="purgeWorkouts()" style="background: #333; color: #ffd700;">Purge Workouts</button>
                    <div id="admin-user-list" style="max-height: 200px; overflow-y: auto; margin-top: 10px;"></div>
                </div>
            </div>

            <div class="glass-panel chat-box">
                <h3>Locker Room</h3>
                <div class="chat-messages" id="chat-window"></div>
                <input type="file" id="chat-photo" accept="image/*" style="display:none;" onchange="document.getElementById('photo-label').innerText = 'Selected';">
                <label id="photo-label" for="chat-photo" style="cursor:pointer; color: var(--accent); border: 1px dashed var(--accent); padding: 5px; text-align: center;">+ Photo</label>
                <div class="chat-inputs">
                    <input type="text" id="chat-input" placeholder="Talk trash..." style="margin:0;">
                    <button onclick="sendChat()" style="width: 80px; margin:0;">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCO-n3z7eN3Xj1zmISJJxZvjyER9GBVnLc",
            authDomain: "sovereignhunt.firebaseapp.com",
            databaseURL: "https://sovereignhunt-default-rtdb.firebaseio.com",
            projectId: "sovereignhunt",
            storageBucket: "sovereignhunt.firebasestorage.app",
            messagingSenderId: "657296200169",
            appId: "1:657296200169:web:22a0f9364344e682083b78"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.database(); const storage = firebase.storage();
        let currentUser = null; let userData = null;
        const ARCHITECT_EMAIL = "architect@mail.com";

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                document.getElementById('user-display').innerText = user.email.split('@')[0];
                db.ref('users/' + user.uid).on('value', snap => {
                    userData = snap.val();
                    if(userData) document.getElementById('balance-display').innerText = userData.balance;
                });
                if (user.email.toLowerCase() === ARCHITECT_EMAIL.toLowerCase()) {
                    document.getElementById('admin-panel').style.display = 'block';
                    initializeGodMode();
                }
                listenToChat(); listenToWorkouts(); listenToChallenges();
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        function register() { auth.createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(err => alert(err.message)); }
        function login() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(err => alert(err.message)); }
        function logout() { auth.signOut(); window.location.reload(); }

        function postWorkout() {
            const exercise = document.getElementById('wo-exercise').value;
            const sets = document.getElementById('wo-sets').value;
            const reps = document.getElementById('wo-reps').value;
            db.ref('workouts').push({ user: currentUser.email.split('@')[0], exercise, sets, reps, time: Date.now() });
        }

        function listenToWorkouts() {
            db.ref('workouts').on('child_added', snap => {
                const data = snap.val();
                const div = document.createElement('div');
                div.className = "workout-card";
                div.innerHTML = `<strong>${data.user}</strong>: ${data.exercise} (${data.sets}x${data.reps})`;
                document.getElementById('workout-feed').prepend(div);
            });
        }

        function sendChat() {
            const text = document.getElementById('chat-input').value;
            const file = document.getElementById('chat-photo').files[0];
            if(file) {
                const ref = storage.ref('chat_photos/' + Date.now());
                ref.put(file).then(s => s.ref.getDownloadURL()).then(url => db.ref('chats').push({ user: currentUser.email.split('@')[0], text, imageUrl: url, time: Date.now() }));
            } else { db.ref('chats').push({ user: currentUser.email.split('@')[0], text, time: Date.now() }); }
        }

        function listenToChat() {
            db.ref('chats').on('child_added', snap => {
                const msg = snap.val();
                const div = document.createElement('div');
                div.className = 'message';
                div.innerHTML = `<span>${msg.user}:</span> ${msg.text} ${msg.imageUrl ? `<br><img src="${msg.imageUrl}">` : ''}`;
                document.getElementById('chat-window').appendChild(div);
            });
        }

        function initiateChallenge() {
            db.ref('active_challenge').set({ challenger: currentUser.email.split('@')[0], desc: document.getElementById('body-part').value + " " + document.getElementById('seductive-stake').value, pot: 0, status: "betting" });
        }

        function listenToChallenges() {
            db.ref('active_challenge').on('value', snap => {
                const data = snap.val();
                if(data && data.status === "betting") {
                    document.getElementById('create-challenge-view').style.display = 'none';
                    document.getElementById('active-challenge-view').style.display = 'block';
                    document.getElementById('challenge-desc').innerText = `${data.challenger} challenged: ${data.desc}`;
                    document.getElementById('pot-amount').innerText = data.pot;
                } else {
                    document.getElementById('create-challenge-view').style.display = 'block';
                    document.getElementById('active-challenge-view').style.display = 'none';
                }
            });
        }

        function placeBet(amount) {
            db.ref('users/' + currentUser.uid).update({ balance: userData.balance - amount });
            db.ref('active_challenge/pot').transaction(p => (p || 0) + amount);
        }

        function revealPhoto() {
            alert("Claiming pot...");
            db.ref('active_challenge').once('value').then(snap => {
                db.ref('users/' + currentUser.uid).update({ balance: userData.balance + snap.val().pot });
                db.ref('active_challenge').remove();
            });
        }

        function initializeGodMode() {
            db.ref('users').on('value', snap => {
                const roster = document.getElementById('admin-user-list');
                roster.innerHTML = '';
                snap.forEach(s => {
                    const u = s.val();
                    roster.innerHTML += `<div style="font-size:0.7em">${u.email} <button onclick="exileUser('${s.key}')">X</button></div>`;
                });
            });
        }

        function exileUser(uid) { db.ref('users/' + uid).remove(); }
        function purgeChat() { db.ref('chats').remove(); }
        function purgeWorkouts() { db.ref('workouts').remove(); }
        function terminateChallenge() { db.ref('active_challenge').remove(); }
    </script>
</body>
</html>
