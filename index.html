<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump & Power | The Secret Iron Club</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #0d0d12;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --accent: #ff0044;
            --text-main: #f0f0f0;
            --text-muted: #888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at top right, #3a0011, #0d0d12 40%);
            background-attachment: fixed;
        }

        /* Seductive, Dynamic Boxes */
        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 0, 68, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(255, 0, 68, 0.4);
            border: 1px solid var(--accent);
        }

        h1, h2, h3 { color: var(--text-main); text-transform: uppercase; letter-spacing: 2px; }
        h1 span { color: var(--accent); }

        /* Login Screen */
        #auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        input, button, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1a1a24;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        
        input:focus { outline: none; border-color: var(--accent); }

        button {
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button:hover { background: #d40038; }

        /* Main Dashboard Layout */
        #app-container { display: none; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; }

        /* Scalable Chat Box */
        .chat-box {
            resize: vertical;
            overflow: hidden;
            min-height: 300px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            border-bottom: 1px solid #333;
            margin-bottom: 10px;
            padding-right: 10px;
        }
        .message { margin-bottom: 10px; font-size: 0.9em; }
        .message span { color: var(--accent); font-weight: bold; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .chat-inputs { display: flex; gap: 10px; }
        
        /* The Poker Table */
        .poker-table { text-align: center; }
        .pot-display { font-size: 3em; color: var(--accent); margin: 20px 0; text-shadow: 0 0 10px var(--accent); }
        .bet-controls { display: flex; justify-content: center; gap: 10px; }
        .bet-btn { width: auto; padding: 10px 20px; }
        
        .stake-warning { color: var(--accent); font-size: 0.8em; font-style: italic; }

    </style>
</head>
<body>

    <div id="auth-container">
        <div class="glass-panel" style="width: 350px; text-align: center;">
            <h1>Pump <span>&</span> Power</h1>
            <p class="stake-warning">Discreet. Seductive. Brutal.</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Enter the Club</button>
            <button onclick="register()" style="background: transparent; border: 1px solid var(--accent);">Request Access (Sign Up)</button>
        </div>
    </div>

    <div id="app-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Iron <span>Syndicate</span></h2>
            <div style="text-align: right;">
                <span id="user-display">User</span> | Bankroll: <strong style="color:var(--accent);">$<span id="balance-display">100</span></strong>
                <button onclick="logout()" style="width: auto; padding: 5px 15px; margin-left: 15px;">Exit</button>
            </div>
        </header>

        <div class="grid">
            
            <div class="glass-panel">
                <h3>Global Pump Feed</h3>
                <p class="text-muted">What everyone is working on...</p>
                <div id="feed" style="overflow-y: auto; height: 500px;">
                    </div>
            </div>

            <div class="glass-panel poker-table">
                <h3>The Alter (Challenge Table)</h3>
                <p class="stake-warning">Fail to reveal, lose the bet.</p>
                
                <div id="active-challenge-view" style="display: none;">
                    <h4 id="challenge-desc">Chest Pump (Tight Tank)</h4>
                    <div class="pot-display">$<span id="pot-amount">0</span></div>
                    <div class="bet-controls">
                        <button class="bet-btn" onclick="placeBet(1)">Call $1</button>
                        <button class="bet-btn" onclick="placeBet(5)">Raise $5</button>
                        <button class="bet-btn" onclick="placeBet(10)">Raise $10</button>
                        <button class="bet-btn" style="background: #333;" onclick="fold()">Fold</button>
                    </div>
                    <button style="margin-top: 20px; background: #fff; color: #000;" onclick="revealPhoto()">REVEAL PUMP (Claim Pot)</button>
                </div>

                <div id="create-challenge-view">
                    <h4>Initiate a Blood-Bet</h4>
                    <select id="body-part">
                        <option value="Chest">Chest Pump</option>
                        <option value="Glutes">Glute Pump</option>
                        <option value="Full Body">Full Body (Shredded)</option>
                    </select>
                    <select id="seductive-stake">
                        <option value="Tight Tank Top">in a Tight Tank Top</option>
                        <option value="Thong">in a Thong</option>
                        <option value="Shirtless Glistening">Shirtless & Glistening</option>
                    </select>
                    <button onclick="initiateChallenge()">Throw the Gauntlet</button>
                </div>
            </div>

            <div class="glass-panel chat-box">
                <h3>Locker Room</h3>
                <div class="chat-messages" id="chat-window"></div>
                
                <input type="file" id="chat-photo" accept="image/*" style="display:none;" onchange="updateFileName()">
                <label for="chat-photo" style="cursor:pointer; color: var(--accent); margin-bottom:10px; display:block; text-align:center; border: 1px dashed var(--accent); padding: 5px;">+ Attach Photo</label>
                
                <div class="chat-inputs">
                    <input type="text" id="chat-input" placeholder="Talk trash..." style="margin:0;">
                    <button onclick="sendChat()" style="width: 80px; margin:0;">Send</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. FIREBASE CONFIGURATION (From Firebase.txt)
        const firebaseConfig = {
            apiKey: "AIzaSyCO-n3z7eN3Xj1zmISJJxZvjyER9GBVnLc",
            authDomain: "sovereignhunt.firebaseapp.com",
            databaseURL: "https://sovereignhunt-default-rtdb.firebaseio.com",
            projectId: "sovereignhunt",
            storageBucket: "sovereignhunt.firebasestorage.app",
            messagingSenderId: "657296200169",
            appId: "1:657296200169:web:22a0f9364344e682083b78"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();

        let currentUser = null;
        let userData = null;

        // 2. AUTHENTICATION (HTML/PHP principles - Session management)
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                document.getElementById('user-display').innerText = user.email.split('@')[0];
                
                // Fetch or Create User DB entry with $100 starting cash
                db.ref('users/' + user.uid).on('value', snap => {
                    if(!snap.exists()) {
                        db.ref('users/' + user.uid).set({ balance: 100, status: "Warming up" });
                    } else {
                        userData = snap.val();
                        document.getElementById('balance-display').innerText = userData.balance;
                    }
                });

                listenToChat();
                listenToChallenges();
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        function register() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        function logout() { auth.signOut(); }

        // 3. CHAT & PHOTO SYSTEM (Dynamic DOM generation)
        function sendChat() {
            const text = document.getElementById('chat-input').value;
            const file = document.getElementById('chat-photo').files[0];
            const username = currentUser.email.split('@')[0];

            if(file) {
                // Upload photo first
                const ref = storage.ref('chat_photos/' + Date.now() + '_' + file.name);
                ref.put(file).then(snapshot => snapshot.ref.getDownloadURL()).then(url => {
                    db.ref('chats').push({ user: username, text: text, imageUrl: url, time: Date.now() });
                    document.getElementById('chat-photo').value = ""; // reset
                });
            } else if (text) {
                db.ref('chats').push({ user: username, text: text, time: Date.now() });
            }
            document.getElementById('chat-input').value = "";
        }

        function listenToChat() {
            db.ref('chats').orderByChild('time').limitToLast(50).on('child_added', snap => {
                const msg = snap.val();
                const div = document.createElement('div');
                div.className = 'message';
                let content = `<span>${msg.user}:</span> ${msg.text}`;
                if(msg.imageUrl) content += `<br><img src="${msg.imageUrl}">`;
                div.innerHTML = content;
                document.getElementById('chat-window').appendChild(div);
                document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
            });
        }

        // 4. THE POKER/BETTING DYNAMICS (The 48 Laws logic)
        let currentChallengeId = null;

        function initiateChallenge() {
            const part = document.getElementById('body-part').value;
            const stake = document.getElementById('seductive-stake').value;
            
            // "Court Attention" - Create the main spectacle
            const challengeRef = db.ref('active_challenge');
            challengeRef.set({
                challenger: currentUser.email.split('@')[0],
                desc: `${part} Pump ${stake}`,
                pot: 0,
                status: "betting"
            });
        }

        function listenToChallenges() {
            db.ref('active_challenge').on('value', snap => {
                const data = snap.val();
                if(data && data.status === "betting") {
                    document.getElementById('create-challenge-view').style.display = 'none';
                    document.getElementById('active-challenge-view').style.display = 'block';
                    document.getElementById('challenge-desc').innerText = `${data.challenger} challenged: ${data.desc}`;
                    document.getElementById('pot-amount').innerText = data.pot;
                } else {
                    document.getElementById('create-challenge-view').style.display = 'block';
                    document.getElementById('active-challenge-view').style.display = 'none';
                }
            });
        }

        function placeBet(amount) {
            if(userData.balance < amount) { alert("Insufficient funds. You are weak."); return; }
            
            // Deduct from user, add to pot
            db.ref('users/' + currentUser.uid).update({ balance: userData.balance - amount });
            
            db.ref('active_challenge/pot').transaction(currentPot => {
                return (currentPot || 0) + amount;
            });

            // Announce bet in chat
            db.ref('chats').push({ 
                user: "SYSTEM", 
                text: `${currentUser.email.split('@')[0]} threw $${amount} into the pot!`, 
                time: Date.now() 
            });
        }

        function fold() {
            db.ref('chats').push({ 
                user: "SYSTEM", 
                text: `${currentUser.email.split('@')[0]} folded and hid their pump in shame.`, 
                time: Date.now() 
            });
        }

        function revealPhoto() {
            // In a full app, this would open a camera/file input, upload, and grant the pot.
            alert("Camera triggered! Photo snapped and uploaded. You claim the pot!");
            
            // Give pot to revealer
            db.ref('active_challenge').once('value').then(snap => {
                const pot = snap.val().pot;
                db.ref('users/' + currentUser.uid).update({ balance: userData.balance + pot });
                db.ref('active_challenge').remove(); // Reset table
            });
        }
    </script>
</body>
</html>
